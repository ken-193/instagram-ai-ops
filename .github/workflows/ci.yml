name: ci
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["state/**", "reports/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg   # no longer preinstalled on ubuntu-latest
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - name: Validate all scripts
        run: for f in posts/*/script.json; do python -m pipeline.schema "$f"; done
