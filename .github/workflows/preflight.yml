name: preflight
# Connection test for Drive / Instagram / TTS / ntfy. Results appear in the run summary.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPROVER_LOGIN: ${{ vars.APPROVER_LOGIN || github.repository_owner }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_VERSION: ${{ vars.IG_API_VERSION || 'v23.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests numpy pillow
      - run: python -m pipeline.preflight
