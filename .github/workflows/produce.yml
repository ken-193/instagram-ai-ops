name: produce
# Build a reel from posts/<id>/script.json, run QC, upload to Drive 06_承認待ち, open an approval issue.
on:
  workflow_dispatch:
    inputs:
      post_id: {description: "投稿ID (例 IG-20261028-001)", required: true}
  push:
    branches: [main]
    paths: ["posts/*/script.json"]

permissions:
  contents: write
  issues: write

concurrency:
  group: produce-${{ github.event.inputs.post_id || github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APPROVER_LOGIN: ${{ vars.APPROVER_LOGIN || github.repository_owner }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Resolve post id
        id: pid
        run: |
          if [ -n "${{ github.event.inputs.post_id }}" ]; then echo "id=${{ github.event.inputs.post_id }}" >> "$GITHUB_OUTPUT"; exit 0; fi
          ids=$(git diff --name-only HEAD~1 HEAD -- 'posts/*/script.json' | cut -d/ -f2 | sort -u)
          n=$(echo "$ids" | grep -c . || true)
          if [ "$n" != "1" ]; then echo "expected exactly one changed script.json, got: $ids"; exit 1; fi
          echo "id=$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - run: git config user.name "reel-bot" && git config user.email "reel-bot@users.noreply.github.com"
      - name: Guard (limits / duplicate protection)
        run: python -m pipeline.ops guard "${{ steps.pid.outputs.id }}"
      - name: Build + QC
        run: python -m pipeline.build "${{ steps.pid.outputs.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.pid.outputs.id }}
          path: posts/${{ steps.pid.outputs.id }}/out/
          retention-days: 30
      - name: Send for approval (Drive upload + GitHub issue)
        run: |
          if [ -z "$GDRIVE_REFRESH_TOKEN" ]; then
            echo "::warning::Google Drive の Secrets が未設定のため承認依頼を送れません。動画は Artifacts（reel-${{ steps.pid.outputs.id }}）から確認できます。docs/ENV_TEMPLATE.md を参照。"
            exit 0
          fi
          python -m pipeline.ops submit "${{ steps.pid.outputs.id }}"
      - name: Notify failure
        if: failure()
        run: python -m pipeline.notify "制作失敗 ${{ steps.pid.outputs.id }}" "produce workflow failed"
