name: studio3d
# 世界の仕様外: render a Blender project scene by scene (parallel frame chunks), assemble the reel,
# check it and save everything to Google Drive (instagram_reel_post/01_projects/<project>/...).
# Triggers: a push that changes studio3d/projects/<project>/04_blender/project.json, or manual run.
on:
  workflow_dispatch:
    inputs:
      project: {description: "プロジェクト名 (studio3d/projects/<name>)", required: true}
      quality: {description: "空欄=project.json の指定 / final (1080x1920) / hd (720x1280 拡大) / draft (540x960 拡大)", required: false, default: ""}
      reuse_run_id: {description: "やり直し時：前回の実行ID（描き終わったコマを再利用）", required: false, default: ""}
  push:
    branches: [main]
    paths: ["studio3d/projects/*/04_blender/project.json"]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: studio3d-${{ github.event.inputs.project || github.sha }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.p.outputs.project }}
      quality: ${{ steps.m.outputs.quality }}
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - id: p
        run: |
          if [ -n "${{ github.event.inputs.project }}" ]; then p="${{ github.event.inputs.project }}"; q="${{ github.event.inputs.quality }}";
          else p=$(git diff --name-only HEAD~1 HEAD -- 'studio3d/projects/*/04_blender/project.json' | head -1 | cut -d/ -f3); q=""; fi
          [ -n "$p" ] || { echo "no project"; exit 1; }
          echo "project=$p" >> "$GITHUB_OUTPUT"; echo "quality=$q" >> "$GITHUB_OUTPUT"
      - id: m
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          done=""
          if [ -n "${{ github.event.inputs.reuse_run_id }}" ]; then
            done=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.inputs.reuse_run_id }}/artifacts" --paginate -q '.artifacts[] | select(.expired == false) | .name' | tr '\n' ' ')
          fi
          q="${{ steps.p.outputs.quality }}"
          python studio3d/run.py matrix "${{ steps.p.outputs.project }}" ${q:+--quality "$q"} --done "$done"

  render:
    needs: plan
    if: ${{ toJson(fromJson(needs.plan.outputs.matrix).include) != '[]' }}   # nothing left to draw (e.g. re-assembling with new sound)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - run: pip install bpy==5.2.3
      - name: Render ${{ matrix.scene }} frames ${{ matrix.start }}-${{ matrix.end }}
        run: python studio3d/run.py render "${{ needs.plan.outputs.project }}" "${{ matrix.scene }}" --start ${{ matrix.start }} --end ${{ matrix.end }} --quality "${{ needs.plan.outputs.quality }}"
      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ matrix.scene }}-${{ matrix.start }}-${{ matrix.end }}
          path: studio3d/projects/${{ needs.plan.outputs.project }}/05_render/frames/
          retention-days: 7

  assemble:
    needs: [plan, render]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.render.result == 'success' || needs.render.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ONDOKU_TOKEN: ${{ secrets.ONDOKU_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Frames from the earlier run (reuse_run_id)
        if: github.event.inputs.reuse_run_id != ''
        # gh pages through every artifact (download-artifact stopped at 98 of 130 for another run's artifacts)
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          tmp=$(mktemp -d)
          gh run download "${{ github.event.inputs.reuse_run_id }}" -R "${{ github.repository }}" -p 'frames-*' -D "$tmp"
          dst="studio3d/projects/${{ needs.plan.outputs.project }}/05_render/frames"
          mkdir -p "$dst"
          for d in "$tmp"/frames-*; do cp -r "$d"/. "$dst"/; done
          echo "artifacts: $(ls -d "$tmp"/frames-* | wc -l)  frames: $(find "$dst" -name '*.png' | wc -l)"
      - uses: actions/download-artifact@v4
        if: needs.render.result == 'success'
        with:
          pattern: frames-*
          path: studio3d/projects/${{ needs.plan.outputs.project }}/05_render/frames/
          merge-multiple: true
      - uses: actions/cache@v4  # narration audio: re-assembling must not spend 音読さん characters again
        with:
          path: .cache/tts
          key: tts3d-${{ needs.plan.outputs.project }}-${{ hashFiles(format('studio3d/projects/{0}/04_blender/audio.json', needs.plan.outputs.project)) }}
          restore-keys: tts3d-${{ needs.plan.outputs.project }}-
      - uses: actions/cache@v4  # Whisper model for the narration readback check
        with:
          path: ~/.cache/huggingface
          key: whisper-medium
      - run: pip install -q faster-whisper==1.2.1
      - name: Assemble + QC + upload to Drive
        run: python -m studio3d.assemble "${{ needs.plan.outputs.project }}" --quality "${{ needs.plan.outputs.quality }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-${{ needs.plan.outputs.project }}
          path: studio3d/projects/${{ needs.plan.outputs.project }}/07_final/
          retention-days: 30
      - name: Notify (GitHub issue, opens on iPhone)
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from pipeline import notify
          p = "${{ needs.plan.outputs.project }}"
          fin = Path(f"studio3d/projects/{p}/07_final")
          links = json.loads((fin / "links.json").read_text())
          qc = json.loads((fin / "qc.json").read_text())
          rows = "\n".join(f"- {'✅' if c['ok'] else '❌'} {c['check']}: {c['detail']}" for c in qc["checks"])
          body = (f"## 3D動画ができました: `{p}`\n\n- 完成動画: {links.get('final')}\n- プロジェクトフォルダ: {links['project_folder']}\n"
                  f"- 03_completed: {links['completed']}\n- 画質: {qc['quality']}\n\n### 自動チェック\n{rows}\n")
          notify.create_issue(f"[3D完成] {p}", body, ["studio3d"], os.environ.get("APPROVER_LOGIN") or "${{ github.repository_owner }}")
          PY
